name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: conductor-server/package-lock.json

      - name: Install dependencies
        working-directory: conductor-server
        run: npm ci

      - name: Run ESLint
        working-directory: conductor-server
        run: npm run lint

      - name: Check Prettier formatting
        working-directory: conductor-server
        run: npm run format:check

  test:
    name: Backend API Tests
    runs-on: ubuntu-latest
    needs: [lint-and-format]
    
    services:
      # Start a PostgreSQL container for integration testing
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: conductor-server/package-lock.json

      - name: Install dependencies
        working-directory: conductor-server
        run: npm ci

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U testuser; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "✅ PostgreSQL is up"

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb
        run: node scripts/migrate.js
        working-directory: conductor-server

      - name: Run Backend Integration Tests
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb
          SESSION_SECRET: ci-test-secret
          NODE_ENV: test
        run: npm run test:integration
        working-directory: conductor-server

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: conductor-server/coverage/
          retention-days: 30