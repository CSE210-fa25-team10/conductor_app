name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: conductor-server/package-lock.json
      - name: Install dependencies
        working-directory: conductor-server
        run: npm ci
      - name: Run ESLint
        working-directory: conductor-server
        run: npm run lint
      - name: Check Prettier formatting
        working-directory: conductor-server
        run: npm run format:check

  # NEW JOB: Catch Dockerfile errors immediately
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [lint-and-format]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./conductor-server
          file: ./conductor-server/Dockerfile
          push: false # We only want to verify it builds
          tags: conductor-server:test

  test:
    name: Backend API Tests
    runs-on: ubuntu-latest
    needs: [lint-and-format]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: conductor-server/package-lock.json
      - name: Install dependencies
        working-directory: conductor-server
        run: npm ci
      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U testuser; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "✅ PostgreSQL is up"
      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb
        run: node scripts/migrate.js
        working-directory: conductor-server
      - name: Run Backend Integration Tests
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb
          SESSION_SECRET: ci-test-secret
          NODE_ENV: test
        run: npm run test:integration
        working-directory: conductor-server

  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: [lint-and-format]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend test dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

  # NEW JOB: Full Stack E2E Tests
  e2e-tests:
    name: End-to-End Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [docker-build, test] # Run only if Docker build and backend tests pass
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies (including Playwright)
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Start Full Stack (Docker Compose)
        run: docker compose up -d --build
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppassword
          POSTGRES_DB: conductor
          NODE_ENV: test
          PORT: 3000
          DATABASE_URL: postgresql://appuser:apppassword@db:5432/conductor
          CORS_ORIGIN: http://localhost:8080
          SESSION_SECRET: e2e-secret-key

      - name: Wait for Services
        run: sleep 10 # Simple wait, or implement a curl loop for healthcheck

      - name: Run E2E Tests
        working-directory: frontend
        run: npx playwright test
        env:
          # Point Playwright to the docker-compose frontend service exposed on 8080
          BASE_URL: http://localhost:8080 

      - name: Stop Containers
        if: always()
        run: docker compose down