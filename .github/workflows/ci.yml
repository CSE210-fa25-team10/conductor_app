name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: conductor-server/package-lock.json
      
      - name: Install dependencies
        working-directory: conductor-server
        run: npm ci
      
      - name: Run ESLint
        working-directory: conductor-server
        run: npm run lint
      
      - name: Check Prettier formatting
        working-directory: conductor-server
        run: npm run format:check

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [lint-and-format]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./conductor-server
          file: ./conductor-server/Dockerfile
          push: false
          tags: conductor-server:test

  test:
    name: Backend API Tests
    runs-on: ubuntu-latest
    needs: [lint-and-format]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: conductor-server/package-lock.json
      
      - name: Install dependencies
        working-directory: conductor-server
        run: npm ci
      
      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U testuser; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is up"
      
      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb
        run: node scripts/migrate.js
        working-directory: conductor-server
      
      - name: Run Backend Integration Tests
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb
          SESSION_SECRET: ci-test-secret
          NODE_ENV: test
        run: npm run test:integration
        working-directory: conductor-server
      
      - name: Run Backend EC2 Unit Tests
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb
          SESSION_SECRET: ci-test-secret
          NODE_ENV: test
        run: npm run test:ec2
        working-directory: conductor-server

  frontend-tests:
    name: Frontend Unit Tests (Jest)
    runs-on: ubuntu-latest
    needs: [lint-and-format]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Verify test structure
        working-directory: frontend
        run: |
          echo "Checking test files..."
          echo "Unit tests (*.test.js):"
          find src/tests/unit -name "*.test.js" -type f 2>/dev/null || echo "No unit tests found"
      
      - name: Run Jest unit tests
        working-directory: frontend
        run: npm run test:unit

  e2e-tests:
    name: End-to-End Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [docker-build, test, frontend-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Verify test structure
        working-directory: frontend
        run: |
          echo "Checking E2E test files..."
          echo "E2E tests (*.spec.js):"
          find src/tests/e2e -name "*.spec.js" -type f 2>/dev/null || echo "No E2E tests found"

      - name: Start Full Stack (Docker Compose)
        run: docker compose up -d --build
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppassword
          POSTGRES_DB: conductor
          NODE_ENV: test
          PORT: 3000
          DATABASE_URL: postgresql://appuser:apppassword@db:5432/conductor
          CORS_ORIGIN: http://localhost:3000
          SESSION_SECRET: e2e-secret-key

      - name: Wait for Services to be Ready
        run: |
          echo "Waiting for services to start..."
          sleep 15
          
          echo "Checking backend health..."
          curl -f http://localhost:3000/login -I || echo "⚠️ Backend not responding yet"
          
          echo "Verifying register endpoint..."
          curl -f http://localhost:3000/register -I || echo "⚠️ Register endpoint not ready"
          
          echo "Services should be ready"

      - name: Run Playwright E2E Tests
        working-directory: frontend
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:3000
          # CRITICAL: Backend (port 3000) serves HTML pages via pageRouter.js
          # nginx (port 8080) only serves static CSS/JS files

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload Playwright Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: frontend/test-results/
          retention-days: 30

      - name: Stop Containers
        if: always()
        run: docker compose down -v