<!DOCTYPE html>
<html>
<head>
  <title>Attendance Roster</title>
  <style>
    body { font-family: Arial; margin: 40px; }
    table { width: 60%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 10px; border: 1px solid #ccc; text-align: left; }
    button { padding: 6px 12px; cursor: pointer; }
  </style>
</head>
<body>

<h1>Attendance Roster</h1>

<label>Activity ID: <input id="activityId" type="number"></label>
<button onclick="loadRoster()">Load Roster</button>

<table id="rosterTable">
  <thead>
    <tr><th>Name</th><th>Present</th></tr>
  </thead>
  <tbody></tbody>
</table>

<script>
async function loadRoster() {
  const activityId = document.getElementById("activityId").value;
  const res = await fetch(`/api/attendance/${activityId}`, {
    headers: {
      "X-Role": "instructor"     // required for backend
    }
  });
  const data = await res.json();

  const tbody = document.querySelector("#rosterTable tbody");
  tbody.innerHTML = "";

  data.forEach(student => {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${student.name}</td>
      <td><input type="checkbox" ${student.present ? "checked" : ""} onchange="setAttendance(${student.user_id}, ${activityId}, this.checked)"></td>
    `;
    tbody.appendChild(row);
  });
}

async function setAttendance(user_id, activity_id, present) {
  await fetch("/api/attendance", {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "X-Role": "instructor"
    },
    body: JSON.stringify({
      user_id,
      course_id: 1,        // Change once course pages exist
      activity_id,
      present
    })
  });
}
</script>

</body>
</html>
