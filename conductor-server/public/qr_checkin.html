<!DOCTYPE html>
<html>
<head>
  <title>QR Check-In</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 80px; }
    input { padding: 10px; font-size: 18px; width: 200px; text-align: center; }
    button { padding: 10px 20px; font-size: 18px; cursor: pointer; margin-top: 10px; }
    #status { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>

<h1>Attendance Check-In</h1>

<p>Enter 6-digit class code:</p>

<input id="qrCode" type="text" maxlength="6">
<br>
<button onclick="checkIn()">Submit</button>

<p id="status"></p>

<script>
async function checkIn() {
  const qr_code = document.getElementById("qrCode").value;

  const res = await fetch("/api/attendance/qr/check-in", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-User-Id": 7     // <---- Replace with real logged-in user later
    },
    body: JSON.stringify({ qr_code })
  });

  const data = await res.json();
  document.getElementById("status").textContent = data.status || data.error;
}
</script>

</body>
</html>
