<!--
====================================================================
  STUDENT MANUAL CHECK-IN PAGE (PIN-BASED)
  ------------------------------------------------------------------

  PURPOSE:
    This page is used ONLY when the QR check-in method fails.
    Students manually enter:
        • course_id   – course running the session
        • pin         – 6-digit PIN shown by instructor
        • email       – identifies the student in database
        • roll_id     – optional, recorded for instructor

  WORKFLOW:
    1. Student clicks "Record My Attendance" inside the LMS.
       → They are redirected to this manual_checkin.html page.

    2. Student enters:
          - Course ID (the course they are enrolled in)
          - PIN      (time-limited 6-digit code)
          - Email    (required)
          - Roll ID  (optional)

    3. When the student submits:
         → POST /api/attendance/checkin is triggered
         → Backend logic:
              - Validates email → resolves user_id
              - Determines the active activity for this course
                within the allowed attendance time window
              - Ensures student is enrolled in the course
              - Validates deterministic PIN for that activity
              - Inserts/updates attendance row

    4. On success:
          ✓ Shows student the session name + timestamp
          ✓ Attendance stored in the database

  NOTE:
    This manual entry system mirrors the QR system except:
      - QR provides activity_id automatically
      - Manual entry requires course_id + PIN to find activity
====================================================================
-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Check-In (Manual)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #e9dbee;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #1f2937;
            box-sizing: border-box;
        }

        .card-box {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            text-align: center;
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            color: #1f2937;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .instruction {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #1f2937;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s;
            color: #1f2937;
        }

        input:focus {
            border-color: #8b5cf6;
            background: #faf5ff;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        button {
            width: 100%;
            padding: 12px 20px;
            background: #8b5cf6;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background: #7c3aed;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(139, 92, 246, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .result-message {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            min-height: 40px;
        }

        .result-message[style*="green"] {
            background: #d1fae5;
            color: #059669 !important;
        }

        .result-message[style*="red"] {
            background: #fee2e2;
            color: #dc2626 !important;
        }

        .result-message:empty {
            display: none;
        }

        @media (max-width: 480px) {
            .card-box {
                padding: 20px;
                margin: 20px;
            }
        }
        #backBtn {
            background-color: #f3f4f6; 
            color: #4b5563;          
            margin-top: 15px;        
        }

        #backBtn:hover {
            background-color: #e5e7eb; 
            transform: translateY(0); 
            box-shadow: none;
        }
    </style>
</head>
<body>

<div class="card-box">
    <h2>Attendance Check-In (Manual PIN)</h2>

    <p class="instruction">
        Use this only if the QR code isn’t working. You need the course ID and PIN shown by your instructor.
    </p>

    <div class="form-group">
        <label for="courseIdInput">Course ID:</label>
        <input id="courseIdInput" type="number" placeholder="e.g. 101" />
    </div>

    <div class="form-group">
        <label for="pinInput">PIN:</label>
        <input id="pinInput" type="text" placeholder="6-digit PIN" maxlength="6" />
    </div>

    <div class="form-group">
        <label for="emailInput">Email:</label>
        <input id="emailInput" type="email" placeholder="you@ucsd.edu" />
    </div>

    <div class="form-group">
        <label for="rollInput">Roll ID (Optional):</label>
        <input id="rollInput" type="text" placeholder="A12345678" />
    </div>

    <button id="submitBtn">Submit Check-In</button>

    <div id="result" class="result-message"></div>
    
    <button id="backBtn" onclick="window.location.href='/student'">Back to Dashboard</button>

    <script src="/js/student/manual_checkin.js"></script>
</div>
</body>
</html>
