<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>My Attendance</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .card {
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 18px;
      width: 70%;
    }
    .title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .bar {
      height: 10px;
      border-radius: 5px;
      background: #eee;
      overflow: hidden;
      margin: 6px 0 10px;
    }
    .bar-inner {
      height: 100%;
      background: #2196F3;
    }
    ul { margin: 0; padding-left: 18px; }
  </style>
</head>
<body>

<h2>My Attendance</h2>

<p><strong>Course:</strong> <span id="courseName">CSE 101</span></p>

<div id="myCard" class="card">
  <div class="title">My overall attendance</div>
  <div id="myStats"></div>
  <div class="bar"><div id="myBar" class="bar-inner" style="width: 0%;"></div></div>
</div>

<div id="groupCard" class="card">
  <div class="title">My team(s)</div>
  <ul id="groupList"></ul>
</div>

<script src="./my_attendance.js"></script>
</body>
</html>
