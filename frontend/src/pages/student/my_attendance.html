<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Attendance</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background-color: #e9dbee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1f2937;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .main-card {
      max-width: 700px;
      margin: 0 auto;
      background-color: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 40px;
      box-sizing: border-box;
    }

    h2 {
      margin-top: 0;
      font-size: 24px;
      color: #1f2937;
      margin-bottom: 20px;
      border-bottom: 2px solid #f3f4f6;
      padding-bottom: 15px;
    }

    .summary-info {
      font-size: 16px;
      margin-bottom: 30px;
      color: #4b5563;
    }

    .summary-info strong {
      color: #1f2937;
      font-weight: 700;
    }

    .card {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 24px;
      background: #fff;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 8px;
    }

    #myStats {
      font-size: 20px;
      font-weight: 600;
      color: #8b5cf6;
      margin-bottom: 12px;
      display: block;
    }

    .bar {
      height: 10px;
      border-radius: 5px;
      background: #f3f4f6;
      overflow: hidden;
      margin: 6px 0 20px;
    }

    .bar-inner {
      height: 100%;
      background: linear-gradient(90deg, #c9c7ca 0%, #8c8b8d 100%);
      border-radius: 5px;
      transition: width 0.5s ease-in-out;
    }

    ul {
      list-style-type: none;
      padding: 0;
      margin: 15px 0 0 0;
    }

    ul li {
      padding: 10px 0;
      border-bottom: 1px solid #f3f4f6;
      font-size: 14px;
      color: #4b5563;
      display: flex;
      align-items: center;
    }

    ul li:last-child {
      border-bottom: none;
    }

    ul li::before {
      content: "•";
      color: #8b5cf6;
      font-weight: bold;
      display: inline-block;
      width: 1em;
      margin-left: -1em;
    }
    
    .section-title {
      font-size: 16px;
      font-weight: 600;
      color: #1f2937;
      margin-top: 0;
      padding-top: 15px;
      border-top: 1px solid #e5e7eb;
    }

    #backBtn {
      margin-top: 24px;
      padding: 10px 18px;
      border-radius: 999px;
      border: none;
      background: #8b5cf6;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(139, 92, 246, 0.3);
      transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
    }

    #backBtn:hover {
      background: #7c3aed;
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(124, 58, 237, 0.35);
    }

    #backBtn:active {
      transform: translateY(0);
      box-shadow: 0 1px 4px rgba(124, 58, 237, 0.3);
    }
  </style>
</head>
<body>

<div class="main-card">
  <h2>My Attendance</h2>

  <div class="summary-info">
    <strong>Course:</strong> <span id="courseName">CSE 101</span>
  </div>

  <div id="myCard" class="card">
    <div class="title">My overall attendance</div>
    <span id="myStats"></span>
    
    <div class="bar">
      <div id="myBar" class="bar-inner"></div>
    </div>

    <h3 class="section-title">Team Attendance Records</h3>
    <ul id="groupList">
      <li>Loading group data...</li>
    </ul>
  </div>

  <button id="backBtn" type="button">Back to Course</button>
</div>

<script src="/js/student/my_attendance.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const backBtn = document.getElementById('backBtn');

    if (backBtn) {
      backBtn.addEventListener('click', () => {
        const params = new URLSearchParams(window.location.search);
        const courseId = params.get('course_id');
        if (courseId) {
          window.location.href = `/course/${courseId}`;

        } else {
          console.error('No course_id in query string');
          window.location.href = '/student/dashboard';
        }
      });
    }
  });
</script>

</body>
</html>
