<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Check-In (QR)</title>
    <style>

        body {
            margin: 0;
            padding: 0;
            background-color: #e9dbee; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #1f2937;
            box-sizing: border-box;
        }

        .card-box {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px; 
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1f2937;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .instruction {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 25px;
        }

        .info-section {
            background-color: #f3f4f6;
            border: 1px dashed #c4b5fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            text-align: left;
        }

        .info-group {
            font-size: 15px;
            margin-bottom: 8px;
            color: #4b5563;
        }

        .info-group strong {
            color: #1f2937;
            font-weight: 600;
            margin-right: 5px;
        }

        .highlight-data {
            font-family: 'Courier New', monospace;
            font-weight: 700;
            color: #8b5cf6; 
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #1f2937;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s;
            color: #1f2937;
        }

        input:focus {
            border-color: #8b5cf6; 
            background: #faf5ff;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        button {
            width: 100%;
            padding: 12px 20px;
            background: #8b5cf6; 
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background: #7c3aed;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(139, 92, 246, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .result-message {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            min-height: 40px; 
        }

        .result-message[style*="green"] {
            background: #d1fae5;
            color: #059669 !important;
        }

        .result-message[style*="red"] {
            background: #fee2e2;
            color: #dc2626 !important;
        }

        @media (max-width: 480px) {
            .card-box {
                padding: 20px;
                margin: 20px;
            }
        }
    </style>
</head>
<body>

<div class="card-box">
    <h1>Attendance Check-In (QR)</h1>

    <p class="instruction">
        If you scanned the QR, the activity and PIN should already be filled. Just enter your email and roll ID.
    </p>

    <div class="info-section">
        <div class="info-group">
            <strong>Activity ID:</strong> <span id="activityIdLabel" class="highlight-data"></span>
        </div>
        <div class="info-group">
            <strong>PIN from QR:</strong> <span id="pinLabel" class="highlight-data"></span>
        </div>
    </div>

    <div class="form-group">
        <label for="emailInput">Email</label>
        <input id="emailInput" type="email" placeholder="you@gmail.com" />
    </div>

    <div class="form-group">
        <label for="rollInput">Roll ID (Optional)</label>
        <input id="rollInput" type="text" placeholder="A12345678" />
    </div>

    <button id="submitBtn">Submit Check-In</button>

    <div id="result" class="result-message"></div>

    <script src="/js/student/checkin.js"></script>
</div>
</body>
</html>
