<!--
===============================================================
  STUDENT QR CHECK-IN PAGE
  --------------------------------------------------------------

  PURPOSE:
    This page is opened when a student scans the QR code
    generated by the instructor. The QR contains:

        • activity_id  – the session being taken
        • pin          – the time-limited 6-digit access code

  WORKFLOW:
    1. Student scans QR → browser opens this page with URL:
          checkin.html?activity_id=7&pin=361049

    2. checkin.js reads these values from URL parameters and
       displays them so the student does not need to type
       anything manually.

    3. Student enters:
          • email    (required to identify the student)
          • roll_id  (optional but recorded)

    4. On Submit:
         → Sends POST /api/attendance/checkin to backend
         → Backend verifies:
              - student exists
              - student enrolled in course
              - activity is within allowed time window
              - PIN is valid for this activity
         → If valid, marks the student “present” for that session.

  NOTE:
    This page is designed to work independently — students do not
    need to be logged into the LMS to check in via QR.

===============================================================
-->

<!DOCTYPE html>
<html>
  <head>
    <title>Student Check-In (QR)</title>
  </head>
  <body>
    <h2>Attendance Check-In (QR)</h2>

    <p>
      If you scanned the QR, the activity and PIN should already be filled. Just
      enter your email and roll ID.
    </p>

    <p><strong>Activity ID:</strong> <span id="activityIdLabel"></span></p>
    <p><strong>PIN from QR:</strong> <span id="pinLabel"></span></p>

    <label>Email:</label><br />
    <input id="emailInput" type="email" placeholder="you@gmail.com" /><br /><br />

    <label>Roll ID:</label><br />
    <input id="rollInput" type="text" placeholder="A12345678" /><br /><br />

    <button id="submitBtn">Submit</button>

    <p id="result" style="font-size:20px;"></p>

    <script src="./checkin.js"></script>
  </body>
</html>
