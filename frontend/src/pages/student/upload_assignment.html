<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Assignment</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #e9dbee; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #1f2937;
            box-sizing: border-box;
        }

        .card-box {
            background-color: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1f2937;
            margin-top: 0;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        input[type="text"],
        input[type="number"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s;
            color: #1f2937;
            background-color: #fff;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1.5px dashed #c4b5fd; 
            border-radius: 8px;
            background: #f9fafb;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        input[type="file"]:hover {
            background: #f3f4f6;
            border-color: #8b5cf6;
        }

        input:focus, textarea:focus {
            border-color: #8b5cf6;
            background: #faf5ff;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            line-height: 1.5;
        }

        button {
            width: 100%;
            padding: 14px 20px;
            background: #8b5cf6;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background: #7c3aed;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #resultMsg {
            margin-top: 20px;
            font-size: 14px;
            text-align: center;
            min-height: 20px;
            line-height: 1.4;
        }
        .error { color: #dc2626; }
        .success { color: #059669; font-weight: 600; }

    </style>
</head>
<body>

<div class="card-box">
    <h1>Submit Assignment</h1>

    <div class="form-group">
        <label for="assignIdInput">Assignment ID</label>
        <input id="assignIdInput" type="number" placeholder="e.g. 5" />
    </div>

    <div class="form-group">
        <label for="emailInput">Student Email</label>
        <input id="emailInput" type="email" placeholder="you@ucsd.edu" />
    </div>

    <div class="form-group">
        <label for="fileInput">Attach File</label>
        <input id="fileInput" type="file" />
    </div>

    <div class="form-group">
        <label for="commentInput">Comments (Optional)</label>
        <textarea id="commentInput" placeholder="Add any notes for the instructor..."></textarea>
    </div>

    <button id="uploadBtn">
        Upload Submission
    </button>

    <div id="resultMsg"></div>
</div>

<script src="./upload_assignment.js"></script>
</body>
</html>
