<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standup Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styling for the rating stars */
        .sentiment-star {
            cursor: pointer;
            font-size: 1.8rem;
            color: #ccc; /* Default grey color */
            transition: color 0.1s;
        }
        .sentiment-star.selected {
            color: #FFD700; /* Gold color */
        }
        .entry-history > div {
            border-left: 3px solid #6366f1;
            padding-left: 1rem;
        }
        .sentiment-emoji {
            font-size: 1.25rem;
            margin-right: 0.5rem;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans p-4 sm:p-8">

    <div class="max-w-4xl mx-auto space-y-8">
        <header class="text-3xl font-extrabold text-gray-800 border-b pb-2">
            Standup Tool
        </header>

        <!-- Main Standup Form -->
        <div id="standupForm" class="bg-white p-6 rounded-xl shadow-lg border border-gray-200">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">Daily Check-in</h2>
            
            <textarea id="contentEl" rows="4" placeholder="What are your high/low points? Any blockers?" 
                      class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 mb-4 text-gray-700"></textarea>

            <!-- Sentiment Ratings -->
            <div id="sentiment-container" class="space-y-3">
                <div class="flex items-center space-x-4">
                    <span class="w-20 font-medium text-gray-600">Personal:</span>
                    <div id="personal-stars" class="rating-group flex"></div>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="w-20 font-medium text-gray-600">Team:</span>
                    <div id="team-stars" class="rating-group flex"></div>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="w-20 font-medium text-gray-600">Course:</span>
                    <div id="course-stars" class="rating-group flex"></div>
                </div>
            </div>

            <button id="submitBtn" 
                    class="mt-6 w-full sm:w-auto px-6 py-3 bg-indigo-600 text-white font-bold rounded-lg shadow-md hover:bg-indigo-700 transition duration-150 ease-in-out disabled:opacity-50">
                Submit Standup
            </button>
        </div>

        <!-- Anonymous Feedback Section -->
        <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-200">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">Anonymous Feedback</h2>
            <p class="text-sm text-gray-500 mb-4">Your message will be recorded anonymously and associated with Course ID 101.</p>
            
            <textarea id="feedbackMessageEl" rows="2" placeholder="Enter your anonymous feedback here..." 
                      class="w-full p-3 border border-gray-300 rounded-lg focus:ring-red-500 focus:border-red-500 mb-4 text-gray-700"></textarea>

            <div class="flex space-x-4">
                <button data-type="COURSE" 
                        class="feedback-btn flex-1 px-4 py-2 bg-red-500 text-white font-semibold rounded-lg hover:bg-red-600 transition">
                    Post Feedback on Course
                </button>
                <button data-type="TEAM" 
                        class="feedback-btn flex-1 px-4 py-2 bg-blue-500 text-white font-semibold rounded-lg hover:bg-blue-600 transition">
                    Post Feedback on Team/Leader
                </button>
            </div>
        </div>


        <!-- History Section -->
        <h2 class="text-2xl font-bold text-gray-800 pt-4">History</h2>
        <div id="entriesContainer" class="space-y-4 entry-history">
            <p class="text-gray-500" id="loadingMessage">Loading past entries...</p>
        </div>
    </div>

<script src="./standup.js"></script>
</body>
</html>
