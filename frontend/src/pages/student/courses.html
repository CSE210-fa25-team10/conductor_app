<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>course detail</title>
    <link rel="stylesheet" href="/css/student/courses.css">
    <link rel="stylesheet" href="/css/standup.css">
</head>
<body>
<div class="header">
    <h1 id="course-title">CSE 210</h1>
</div>

<div class="top-right-menu">
    <button id="view-attendance-btn" class="attendance-btn">
        View My Attendance
    </button>
</div>

<div class="container">
    <div class="section">
        <div class="section-header">
            <span>Assignments</span>
            <span>→</span>
        </div>
        <!--  Assignments loaded by courses.js    -->
    </div>
    <!-- Group Info Section - 根据角色动态显示 -->
    <div id="group-info-section"></div>
    <div class="section">
        <div class="section-header">
            <span>Standup Tool</span>
        </div>

        <div class="standup-card">
            <!-- Status Report Input -->
            <div class="standup-input-section">
                <textarea class="standup-textarea" placeholder="Add text..."></textarea>
            </div>

            <!-- Pulse Section -->
            <div class="pulse-section">
                <h3 class="pulse-title">Sentiment</h3>

                <!-- Personal Row -->
                <div class="pulse-row">
                    <span class="pulse-label">Personal</span>
                    <div class="pulse-emojis">
                        <button class="emoji-btn" data-value="1">😰</button>
                        <button class="emoji-btn" data-value="2">😞</button>
                        <button class="emoji-btn" data-value="3">😐</button>
                        <button class="emoji-btn" data-value="4">😊</button>
                        <button class="emoji-btn" data-value="5">😄</button>
                    </div>
                </div>

                <!-- Team Row -->
                <div class="pulse-row">
                    <span class="pulse-label">Team</span>
                    <div class="pulse-emojis">
                        <button class="emoji-btn" data-value="1">😰</button>
                        <button class="emoji-btn" data-value="2">😞</button>
                        <button class="emoji-btn" data-value="3">😐</button>
                        <button class="emoji-btn" data-value="4">😊</button>
                        <button class="emoji-btn" data-value="5">😄</button>
                    </div>
                </div>

                <!-- Course Row -->
                <div class="pulse-row">
                    <span class="pulse-label">Course</span>
                    <div class="pulse-emojis">
                        <button class="emoji-btn" data-value="1">😰</button>
                        <button class="emoji-btn" data-value="2">😞</button>
                        <button class="emoji-btn" data-value="3">😐</button>
                        <button class="emoji-btn" data-value="4">😊</button>
                        <button class="emoji-btn" data-value="5">😄</button>
                    </div>
                </div>
            </div>

            <!-- Save Button -->
            <div class="standup-actions">
                <button class="save-btn">Save</button>
            </div>
        </div>

        <!-- Work Journal Section -->
        <div class="section-header" style="margin-top: 32px;">
            <span>History</span>
        </div>

        <div class="journal-grid">
            <!-- Left: Dates -->
            <div class="journal-dates">
                <a href="#" class="journal-date-link">Nov 23, 2025</a>
                <a href="#" class="journal-date-link">More...</a>
            </div>

            <!-- Right: Pulses -->
            <div class="journal-pulses">
                <div class="pulse-title">Sentiment</div>
                <div class="journal-pulse-entry">
                    <span class="pulse-date">Jan 16, 2024</span>
                    <span class="pulse-emoji">😞</span>
                </div>
                <div class="journal-pulse-entry">
                    <span class="pulse-date">Jan 15, 2024</span>
                    <span class="pulse-emoji">😄</span>
                </div>
            </div>
        </div>
    </div>

</div>
<script src="/js/student/courses.js"></script>
<script src="/js/standup.js"></script>
</body>
</html>
