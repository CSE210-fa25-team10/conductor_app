<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>course detail</title>
    <link rel="stylesheet" href="courses.css">
</head>
<body>
<div class="header">
    <h1>CSE 210</h1>
</div>

<div class="container">
    <div class="section">
        <div class="section-header">
            <span>Assignments</span>
            <span>→</span>
        </div>

        <div class="card">
            <div class="card-icon">🏔️</div>
            <div class="card-content">
                <div class="card-title">Assignment Title 1</div>
                <div class="card-due">Due 7pm @ Nov 3, 2025</div>
                <div class="card-status">
                    <span class="status-icon checked"></span>
                    <span>(Status) Submitted • at 1:12pm, Oct 30, 2025</span>
                </div>
            </div>
            <div class="card-grade">Grade: 30/40</div>
        </div>

        <div class="card">
            <div class="card-icon">🏔️</div>
            <div class="card-content">
                <div class="card-title">Assignment Title 2</div>
                <div class="card-due">Due 7pm @ Nov 4, 2025</div>
                <div class="card-status">
                    <span class="status-icon"></span>
                    <span>(Status) Not Submitted • No Submission .</span>
                </div>
            </div>
            <div class="card-grade">Grade: 30/40</div>
        </div>
    </div>
    <!-- Group Info Section - 根据角色动态显示 -->
    <div id="group-info-section"></div>
</div>
<script src="courses.js"></script>
</body>
</html>
