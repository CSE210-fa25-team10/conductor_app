<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>

  <link rel="stylesheet" href="../../css/login.css" />

</head>
<body>
  <div class="auth-container">
    <h2 class="auth-title">Welcome Back</h2>
    <p class="auth-subtext">Sign in to access your dashboard</p>

    <!-- error box that login.js can use -->
    <div id="loginError" class="error-message" style="display: none;"></div>

    <form id="loginForm" class="auth-form">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="you@example.com"
        autocomplete="email"
      />

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="••••••••"
        autocomplete="current-password"
      />

      <button type="submit" id="loginButton" class="primary-btn">Sign In</button>

      <!-- OAUTH DIVIDER -->
      <div class="oauth-divider"><span>or</span></div>

      <!-- GOOGLE LOGIN BUTTON with inline SVG -->
      <button type="button" class="google-button" id="googleLoginBtn">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Sign in with Google
      </button>

      <p class="auth-footer">
        Don't have an account?
        <!-- register.html is in the same auth/ folder -->
        <a href="./register.html">Register</a>
      </p>

      <!-- DEMO LOGIN (no backend) -->
      <div style="margin-top:12px; display:flex; gap:8px; justify-content:center;">
        <button id="demoStudentBtn" class="secondary-btn" type="button">Demo: Student</button>
        <button id="demoInstructorBtn" class="secondary-btn" type="button">Demo: Instructor</button>
      </div>
    </form>
  </div>

  <!-- Page-specific JS -->
  <script src="../../js/auth.js"></script>
  <script src="../../js/demo-login.js"></script>
  <script>
    // wire demo buttons
    document.addEventListener('DOMContentLoaded', () => {
      const demoStudent = document.getElementById('demoStudentBtn');
      const demoInstructor = document.getElementById('demoInstructorBtn');
      if (demoStudent) demoStudent.addEventListener('click', () => demoSignIn('student'));
      if (demoInstructor) demoInstructor.addEventListener('click', () => demoSignIn('instructor'));
    });
  </script>
  <script src="../../js/login.js"></script>
  <!-- Shared Google OAuth logic for login & register -->
  <script src="../../js/google_oauth.js"></script>
</body>
</html>
