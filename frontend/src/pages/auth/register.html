<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Account • Conductor</title>
  <link rel="stylesheet" href="../../css/register.css" />
</head>
<body>
  <div class="auth-container">
    <!-- heading -->
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-subtitle">
      Join your classmates and keep all your course work in one place.
    </p>

    <!-- error / success banners (used by register.js + tests) -->
    <div id="registerError" class="auth-error" role="alert" style="display:none;"></div>
    <div id="registerSuccess" class="auth-success" role="status" style="display:none;"></div>

    <!-- REGISTRATION FORM -->
    <form id="registerForm" class="auth-form" novalidate>
      <div class="auth-field-row">
        <div class="auth-field-group">
          <label class="auth-label" for="firstName">First name</label>
          <input
            id="firstName"
            name="firstName"
            type="text"
            class="auth-input"
            placeholder="John"
            required
          />
        </div>

        <div class="auth-field-group">
          <label class="auth-label" for="lastName">Last name</label>
          <input
            id="lastName"
            name="lastName"
            type="text"
            class="auth-input"
            placeholder="Doe"
            required
          />
        </div>
      </div>

      <div class="auth-field-group">
        <label class="auth-label" for="pronunciation">
          Preferred name / pronunciation (optional)
        </label>
        <input
          id="pronunciation"
          name="pronunciation"
          type="text"
          class="auth-input"
          placeholder="LEE-sah, Sam, Alex"
        />
      </div>

      <div class="auth-field-group">
        <label class="auth-label" for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          class="auth-input"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />
      </div>

      <!-- ROLE SELECTOR - Side-by-side buttons -->
      <div class="auth-field-group">
        <label class="auth-label">I am a</label>
        <div class="role-selector" id="roleSelector">
          <div class="role-option" data-role="student">
            <span class="role-emoji">🎓</span>
            <span class="role-label">Student</span>
          </div>
          
          <div class="role-option" data-role="instructor">
            <span class="role-emoji">👨‍🏫</span>
            <span class="role-label">Instructor</span>
          </div>
        </div>
        <!-- Hidden input to store selected role -->
        <input type="hidden" id="role" name="role" value="" required />
      </div>

      <div class="auth-field-group">
        <label class="auth-label" for="password">Password</label>
        <div class="password-row">
          <input
            id="password"
            name="password"
            type="password"
            class="auth-input"
            autocomplete="new-password"
            required
          />
          <button
            type="button"
            id="togglePassword"
            class="password-toggle"
            aria-label="Show password"
          >
            👁
          </button>
        </div>
        <p class="auth-password-hint">
          Use at least 8 characters, including a number.
        </p>
      </div>

      <div class="auth-field-group">
        <label class="auth-label" for="confirmPassword">Confirm password</label>
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          class="auth-input"
          autocomplete="new-password"
          required
        />
      </div>

      <button type="submit" class="primary-btn">
        Create account
      </button>
    </form>

    <!-- Divider -->
    <div class="oauth-divider">
      <span>or</span>
    </div>

    <!-- GOOGLE REGISTER BUTTON -->
    <button
      type="button"
      id="googleRegisterBtn"
      class="google-button"
      data-url="/api/auth/google"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      <span>Continue with Google</span>
    </button>

    <p class="auth-footer">
      Already have an account?
      <a href="login.html">Login</a>
    </p>

      <!-- DEMO REGISTER -> act like registering as demo roles -->
      <div style="margin-top:12px; display:flex; gap:8px; justify-content:center;">
        <button id="demoRegisterStudent" class="secondary-btn" type="button">Demo: Student</button>
        <button id="demoRegisterInstructor" class="secondary-btn" type="button">Demo: Instructor</button>
      </div>
  </div>

  <!-- Google Identity Services (if you're using it) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Page logic -->
  <script src="../../js/auth.js"></script>
  <script src="../../js/demo-login.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const ds = document.getElementById('demoRegisterStudent');
      const di = document.getElementById('demoRegisterInstructor');
      if (ds) ds.addEventListener('click', () => demoSignIn('student'));
      if (di) di.addEventListener('click', () => demoSignIn('instructor'));
    });
  </script>
  <script src="../../js/register.js"></script>
</body>
</html>
