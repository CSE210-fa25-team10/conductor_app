<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Conductor</title>
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-header">
      <div class="auth-title">Create your account</div>
      <div class="auth-subtitle">Sign up to start using Conductor</div>
    </div>

    <div id="registerError" class="error-message"></div>
    <div id="registerSuccess" class="success-message"></div>

    <form id="registerForm" novalidate>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" for="firstName">First name</label>
          <input
            type="text"
            id="firstName"
            class="form-input"
            name="firstName"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="lastName">Last name</label>
          <input
            type="text"
            id="lastName"
            class="form-input"
            name="lastName"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="pronunciation">
          Preferred name / pronunciation (optional)
        </label>
        <input
          type="text"
          id="pronunciation"
          class="form-input"
          name="pronunciation"
          placeholder="e.g., LEE-sah, Sam, Alex"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input
          type="email"
          id="email"
          class="form-input"
          name="email"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="phone">Phone (optional)</label>
        <input
          type="tel"
          id="phone"
          class="form-input"
          name="phone"
          autocomplete="tel"
          placeholder="(123) 456-7890"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="role">Role</label>
        <select id="role" name="role" class="form-select" required>
          <option value="" selected disabled>Select your role</option>
          <option value="student">Student</option>
          <option value="instructor">Instructor</option>
        </select>
        <p class="small-note">
          Your role determines which dashboard you see after login.
        </p>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="password-row">
          <input
            type="password"
            id="password"
            class="form-input"
            name="password"
            autocomplete="new-password"
            required
          />
          <button type="button" id="togglePassword" class="toggle-password">
            Show
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirm password</label>
        <input
          type="password"
          id="confirmPassword"
          class="form-input"
          name="confirmPassword"
          autocomplete="new-password"
          required
        />
      </div>

      <button type="submit" class="auth-button" id="registerButton">
        Create account
      </button>

      <p class="small-note">
        By creating an account, your name and email will be used to populate your
        profile. First and last name cannot be changed later.
      </p>
    </form>

    <div class="oauth-divider">
      <span>or</span>
    </div>

    <button type="button" id="googleRegisterBtn" class="google-button">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>

    <div class="auth-footer">
      Already have an account?
      <a href="/login">Sign in</a>
    </div>
  </div>
  <script src="/js/register.js"></script>
  <script src="/js/google_oauth.js"></script>
</body>
</html>
