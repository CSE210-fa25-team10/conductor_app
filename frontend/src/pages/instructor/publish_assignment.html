<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publish Assignment</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #e9dbee;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #1f2937;
            box-sizing: border-box;
        }

        .card-box {
            background-color: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 550px;
            box-sizing: border-box;
        }

        .header-row {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            position: relative;
        }

        .back-btn {
            background: none;
            border: none;
            color: #8b5cf6;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: auto;
            margin: 0;
            transition: all 0.2s;
            border-radius: 8px;
        }

        .back-btn:hover {
            background: #f3e8ff;
            transform: translateX(-2px);
        }

        .back-btn:active {
            transform: translateX(0);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1f2937;
            margin: 0;
            flex: 1;
            text-align: center;
        }

        .placeholder {
            width: 40px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s;
            color: #1f2937;
            background-color: #fff;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            line-height: 1.5;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #8b5cf6;
            background: #faf5ff;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .row-group {
            display: flex;
            gap: 20px;
        }
        .row-group .form-group {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 14px 20px;
            background: #8b5cf6;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background: #7c3aed;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #resultMsg {
            margin-top: 20px;
            font-size: 14px;
            text-align: center;
            min-height: 20px;
        }
        .error { color: #dc2626; }
        .success { color: #059669; font-weight: 600; }

    </style>
</head>
<body>

<div class="card-box">
    <div class="header-row">
        <button class="back-btn" onclick="history.back()">←</button>
        <h1>Create Assignment</h1>
        <div class="placeholder"></div>
    </div>

    <div class="form-group">
        <label for="courseIdInput">Course ID</label>
        <input id="courseIdInput" type="number" placeholder="e.g. 101" />
    </div>

    <div class="form-group">
        <label for="titleInput">Assignment Title</label>
        <input id="titleInput" type="text" placeholder="e.g. Midterm Project Proposal" />
    </div>

    <div class="form-group">
        <label for="descInput">Instructions / Description</label>
        <textarea id="descInput" placeholder="Enter the details of the assignment here..."></textarea>
    </div>

    <div class="row-group">
        <div class="form-group">
            <label for="dueDateInput">Due Date</label>
            <input id="dueDateInput" type="datetime-local" />
        </div>
        <div class="form-group">
            <label for="pointsInput">Points</label>
            <input id="pointsInput" type="number" placeholder="e.g. 100" />
        </div>
    </div>

    <button id="publishBtn">
        Publish Assignment
    </button>

    <div id="resultMsg"></div>
</div>

<script src="/js/instructor/publish_assignment.js"></script>
</body>
</html>
