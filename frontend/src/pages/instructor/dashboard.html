<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="/css/instructor/dashboard.css">
</head>
<body>
    <div class="content-box">
        <div class="top-bar">
            <div class="avatar">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/>
                    <path d="M6 21C6 17.134 8.686 14 12 14C15.314 14 18 17.134 18 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>

            <div class="icon">
                <a href="/instructor/attendance" class="attendance-btn" style="margin-left:15px;">
                    Take Attendance
                </a>

                <button class="join-class-btn">Create Class</button>
                <button class="icon-btn logout" title="Logout">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>
        </div>

        <div class="user-info-section">
            <h2 class="user-greeting">Hi, User_name</h2>
            
            <div class="info-display">
                <div class="info-row">
                    <!-- Major -->
                    <div class="info-group">
                        <div class="info-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                                <circle cx="9" cy="9" r="1.5" fill="currentColor"/>
                                <circle cx="15" cy="9" r="1.5" fill="currentColor"/>
                                <path d="M8 14C8 14 9.5 16 12 16C14.5 16 16 14 16 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <div class="info-box">
                            <span class="info-text">major</span>
                        </div>
                    </div>
                    
                    <!-- Email -->
                    <div class="info-group">
                        <div class="info-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
                                <path d="M3 7L12 13L21 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <div class="info-box">
                            <span class="info-text">email</span>
                        </div>
                    </div>
                </div>
                
                <div class="info-row">
                    <!-- Pronouns -->
                    <div class="info-group">
                        <div class="info-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <circle cx="9" cy="7" r="3" stroke="currentColor" stroke-width="2"/>
                                <path d="M3 21V19C3 17.3431 4.34315 16 6 16H12C13.6569 16 15 17.3431 15 19V21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <circle cx="17" cy="7" r="2" stroke="currentColor" stroke-width="2"/>
                                <path d="M21 21V19C21 18.4477 20.5523 18 20 18H18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <div class="info-box">
                            <span class="info-text">pronouns</span>
                        </div>
                    </div>
                    
                    <!-- Phone -->
                    <div class="info-group">
                        <div class="info-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <path d="M22 16.92V19.92C22 20.4831 21.5544 20.9398 20.9913 20.9401C10.4254 20.9401 2 12.5147 2 1.94876C2 1.38561 2.45614 0.940186 3.01929 0.940186H6.01929C6.57157 0.940186 7.01929 1.3879 7.01929 1.94019V5.5C7.01929 6.05228 6.57157 6.5 6.01929 6.5H4.01929C4.53669 13.3965 10.1228 18.9826 17.0193 19.5V17.5C17.0193 16.9477 17.467 16.5 18.0193 16.5H21.5193C22.0716 16.5 22.5193 16.9477 22.5193 17.5L22 16.92Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <div class="info-box">
                            <span class="info-text">phone</span>
                        </div>
                    </div>
                </div>

                <div class="info-row">
                    <!-- Social Media -->
                    <div class="info-group">
                        <div class="info-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
                                <path d="M12 3C12 3 8 7 8 12C8 17 12 21 12 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <path d="M12 3C12 3 16 7 16 12C16 17 12 21 12 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <path d="M3 12H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <path d="M5 8H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <path d="M5 16H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <div class="info-box">
                            <span class="info-text">social media</span>
                        </div>
                    </div>
                    
                    <!-- Free time -->
                    <div class="info-group">
                        <div class="info-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/>
                                <path d="M3 10H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <path d="M8 2V6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <path d="M16 2V6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <div class="info-box">
                            <span class="info-text">free time</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="courses-section">
            <div class="section-header">
                <h2 class="section-title">Courses</h2>
                <svg class="arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            
            <!-- course list -->
            <div class="courses-list" id="coursesList">
             
            </div>
        </div>
    
    </div>
    
    <div id="createCourseModal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h3>Create New Course</h3>
                <button class="close-modal-btn" onclick="closeCreateCourseModal()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <form id="createCourseForm" onsubmit="handleCreateCourse(event)">
                <div class="form-group">
                    <label>Course Name <span class="required">*</span></label>
                    <input type="text" name="courseName" placeholder="e.g. Intro to Computer Science" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Course Code <span class="required">*</span></label>
                        <input type="text" name="courseCode" placeholder="e.g. CS101" required>
                    </div>
                    <div class="form-group">
                        <label>Semester</label>
                        <input type="text" name="semester" value="2024-Fall">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Instructor</label>
                        <input type="text" name="instructor" placeholder="Dr. Name">
                    </div>
                    <div class="form-group">
                        <label>Schedule</label>
                        <input type="text" name="schedule" placeholder="e.g. Mon/Wed 10:00 AM">
                    </div>
                </div>

                <div class="form-group">
                    <label>Course Detail / Description</label>
                    <textarea name="courseDetail" rows="4" placeholder="Enter course objectives, prerequisites, or description..."></textarea>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="closeCreateCourseModal()">Cancel</button>
                    <button type="submit" class="btn-submit">Create Course</button>
                </div>
            </form>
        </div>
    </div>
    <script src="/js/instructor/dashboard.js"></script>
</body>
</html>
