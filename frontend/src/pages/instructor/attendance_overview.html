<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Course Attendance Overview</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .group-card {
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 18px;
      width: 80%;
    }
    .group-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }
    .group-name { font-size: 18px; font-weight: bold; }
    .group-percent { font-size: 14px; color: #555; }
    table { width: 100%; border-collapse: collapse; margin-top: 6px; }
    th, td { border: 1px solid #ddd; padding: 6px 8px; }
    th { background: #f5f5f5; }
    .bar {
      height: 8px;
      border-radius: 4px;
      background: #eee;
      overflow: hidden;
    }
    .bar-inner {
      height: 100%;
      background: #4CAF50;
    }
  </style>
</head>
<body>

<h2>Instructor — Course Attendance</h2>

<p><strong>Course:</strong> <span id="courseName">CSE 101</span></p>
<p><strong>Total sessions:</strong> <span id="totalSessions">–</span></p>

<div id="groupsContainer"></div>

<script src="./attendance_overview.js"></script>
</body>
</html>
