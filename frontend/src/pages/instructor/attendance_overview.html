<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Attendance Overview</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background-color: #e9dbee; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1f2937;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .main-card {
      max-width: 900px; 
      margin: 0 auto;
      background-color: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 40px;
      box-sizing: border-box;
    }

    h2 {
      margin-top: 0;
      font-size: 24px;
      color: #1f2937;
      margin-bottom: 20px;
      border-bottom: 2px solid #f3f4f6;
      padding-bottom: 15px;
    }

    .summary-box {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
      background: #f9fafb;
      padding: 15px 20px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      flex-wrap: wrap;
    }

    .summary-item {
      font-size: 14px;
      color: #4b5563;
    }

    .summary-item strong {
      color: #1f2937;
      font-weight: 600;
      margin-right: 5px;
    }

    .group-card {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 24px;
      background: #fff;
      transition: all 0.2s ease;
    }

    .group-card:hover {
      border-color: #c4b5fd; 
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.1);
    }

    .group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .group-name {
      font-size: 18px;
      font-weight: 700;
      color: #1f2937;
    }

    .group-percent {
      font-size: 14px;
      font-weight: 600;
      color: #8b5cf6;
      background: #f5f3ff;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .bar {
      height: 8px;
      border-radius: 4px;
      background: #f3f4f6;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .bar-inner {
      height: 100%;
      background: linear-gradient(90deg, #8b5cf6 0%, #7c3aed 100%); 
      border-radius: 4px;
      transition: width 0.5s ease-in-out;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 14px;
    }

    th, td {
      border: none;
      padding: 12px 16px;
      text-align: left;
    }

    th {
      background: #f9fafb;
      color: #6b7280;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.05em;
      border-bottom: 1px solid #e5e7eb;
    }

    tr {
      border-bottom: 1px solid #f3f4f6;
    }

    tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background-color: #f9fafb;
    }

    td:nth-child(2), td:nth-child(3), td:nth-child(4),
    th:nth-child(2), th:nth-child(3), th:nth-child(4) {
      text-align: center;
    }

    td:last-child {
      font-weight: 600;
      color: #4b5563;
    }

    #backBtn {
      margin-top: 24px;
      padding: 10px 18px;
      border-radius: 999px;
      border: none;
      background: #8b5cf6;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(139, 92, 246, 0.3);
      transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
    }

    #backBtn:hover {
      background: #7c3aed;
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(124, 58, 237, 0.35);
    }

    #backBtn:active {
      transform: translateY(0);
      box-shadow: 0 1px 4px rgba(124, 58, 237, 0.3);
    }

    @media (max-width: 600px) {
      body { padding: 20px 10px; }
      .main-card { padding: 20px; }
      .group-header { flex-direction: column; align-items: flex-start; gap: 5px; }
      th, td { padding: 8px 4px; font-size: 13px; }
    }
  </style>
</head>
<body>

<div class="main-card">
  <h2>Instructor — Course Attendance</h2>

  <div class="summary-box">
    <div class="summary-item">
      <strong>Course:</strong> <span id="courseName">CSE 101</span>
    </div>
    <div class="summary-item">
      <strong>Total sessions:</strong> <span id="totalSessions">–</span>
    </div>
  </div>

  <div id="groupsContainer"></div>

  <button id="backBtn">Back to Courses</button>
</div>

<script src="/js/instructor/attendance_overview.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const backBtn = document.getElementById('backBtn');

    if (backBtn) {
      backBtn.addEventListener('click', () => {
        const parts = window.location.pathname.split('/');
        const courseId = parts[parts.length - 1];  
        window.location.href = `/instructor/courses/${courseId}`;
      });
    }
  });
</script>
</body>
</html>
