<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #e9dbee; 
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #1f2937;
        }

        .card-box {
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 480px; 
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1f2937;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #1f2937;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s;
            color: #1f2937;
        }

        input:focus {
            border-color: #8b5cf6; 
            background: #faf5ff;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        button {
            width: 100%;
            padding: 12px 20px;
            background: #8b5cf6; 
            color: white;
            border: none;
            border-radius: 20px; 
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background: #7c3aed;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(139, 92, 246, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        /* ============================================
           result
           ============================================ */
        .result-section {
            margin-top: 30px;
            border-top: 1px solid #e5e7eb;
            padding-top: 20px;
        }

        h3 {
            font-size: 14px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 20px 0 10px 0;
        }

        #qrImg {
            max-width: 200px;
            height: auto;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            padding: 5px;
            background: #fff;
            display: block;
            margin: 0 auto;
            min-height: 10px; 
        }

        img[src=""], img:not([src]) {
            display: none;
        }

        #pinCode {
            font-family: 'Courier New', monospace; 
            font-size: 36px !important; 
            font-weight: 700;
            color: #8b5cf6; 
            margin: 10px 0;
            letter-spacing: 4px;
        }

        #sessionInfo {
            font-size: 13px;
            color: #6b7280;
            margin-top: 10px;
            background: #f3f4f6;
            padding: 8px;
            border-radius: 6px;
            display: inline-block;
        }
        
        #sessionInfo:empty {
            display: none;
        }

    </style>
</head>
<body>

    <div class="card-box">
        <h1>Attendance Tool</h1>

        <div class="form-group">
            <label for="courseIdInput">Course ID</label>
            <input id="courseIdInput" type="number" placeholder="e.g. 101" />
        </div>

        <div class="form-group">
            <label for="nameInput">Session Name</label>
            <input id="nameInput" type="text" placeholder="e.g. Lecture 5" />
        </div>

        <button id="startAttendanceBtn">Start Session</button>

        <div class="result-section">
            <h3>QR Code</h3>
            <img id="qrImg" />

            <h3>PIN Code</h3>
            <p id="pinCode"></p>

            <p id="sessionInfo"></p>
        </div>
    </div>

        <script src="../../js/auth.js"></script>
        <script>
            (function(){
                const a = window.__ConductorAuth;
                if (a) {
                    const u = a.getAuth();
                    if (!u || u.role !== 'instructor') {
                        a.requireRole('instructor', true);
                    }
                }
            })();
        </script>
        <script src="./attendance.js"></script>
</body>
</html>
